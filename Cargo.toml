[workspace]
members = [
    "crates/remote-hosts-api",
    "crates/remote-hosts-cli",
    "crates/remote-hosts-connector",
    "crates/remote-hosts-core",
    "crates/remote-hosts-db",
    "crates/remote-hosts-domain",
    "crates/remote-hosts-launcher",
    "crates/remote-hosts-mcp",
    "crates/remote-hosts-sync",
    "crates/remote-hosts-vault",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/remote-hosts"
authors = ["Remote Hosts Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http1", "json", "tokio", "tracing"] }
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
openssh = { version = "0.11.6", default-features = false, features = ["native-mux"] }
openssh-sftp-client = { version = "0.15.7", features = ["openssh"] }
postcard = { version = "1.1.3", features = ["alloc"] }
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-io"] }
russh = "0.62.2"
russh-sftp = "2.3.0"
schemars = { version = "1.2.1", features = ["uuid1"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres", "uuid", "time", "json", "migrate"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "timeout", "cors", "compression-full", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.4", features = ["serde", "v4", "v5", "v7"] }
zeroize = { version = "1.9.0", features = ["derive"] }
zstd = "0.13.3"
