[package]
name = "remote-hosts-code"
version = "0.10.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["form", "query"] }
base64.workspace = true
clap.workspace = true
cap-std = "3.4.5"
diffy = "0.4.2"
fs2 = "0.4.3"
ignore = "0.4.25"
globset = "0.4.18"
portable-pty = "0.9.0"
regex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
remote-hosts-token-output = { path = "../remote-hosts-token-output" }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "2.7.0"
sqlx.workspace = true
subtle = "2.6.1"
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.0"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
uuid.workspace = true
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["signal", "process", "fs", "poll"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
