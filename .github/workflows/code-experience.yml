name: Code experience contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.94.1
      - name: Check format
        run: cargo fmt -p remote-hosts-code -p remote-hosts-release -- --check
      - name: Check warnings and generated contract
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p remote-hosts-code -p remote-hosts-release --all-targets --locked -- -D warnings
          cargo build -p remote-hosts-code --bin remote-hosts-code --locked
          target/debug/remote-hosts-code adapter-contract --output crates/remote-hosts-code/adapter-contract.json --check
          git diff --exit-code -- crates/remote-hosts-code/adapter-contract.json
      - name: Exercise source, recovery and authenticated protocol contracts
        run: cargo test -p remote-hosts-code -p remote-hosts-release -p remote-hosts-mcp -p remote-hosts-token-output --locked --no-fail-fast -- --test-threads=1 --color never
      - name: Verify transitional release evidence
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts/tests -v
